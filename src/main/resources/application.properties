spring.application.name=EventSourcing_Cqrs
server.port=8080
#spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:accounts-db
# pour serialiser le payload dans eventstore en json car par defaut axon serialise en xml
axon.serializer.general=xstream
axon.serializer.messages=xstream
axon.serializer.events=jackson


# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/accounts_db}
spring.datasource.username=admin
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true